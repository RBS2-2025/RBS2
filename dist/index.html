<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SPIRIT | Home</title>
        <link rel="stylesheet" href="/css/header.css" />
        <link rel="shortcut icon" href="/images/logo_spirit_mark.png" type="image/x-icon" />
        <style>
            #landing_image {
                width: 600px;
                display: flex;
                align-items: center;
                flex-direction: column;
            }
            #landing_mask {
                height: calc(0.84 * 500px);
            }
            #landing_text {
                height: calc(0.16 * 500px);
            }
            #slogan {
                margin-top: 20px;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -o-user-select: none;
                user-select: none;
            }
            #slogan h1 {
                position: absolute;
                font-size: 72px;
                margin: 0;
                color: var(--white);
                line-height: 72px;
                font-weight: 300;
                filter: drop-shadow(0 2px 2px #00000044);
            }
            #slogan h1 span {
                color: var(--white);
                font-weight: 400;
            }
            #slogan #kor {
                transform: scaleY(1) translateX(-50%);
                transform-origin: top;
                transition: all 0.1s ease;
                cursor: default;
            }
            #slogan #eng {
                transform: scaleY(0) translateX(-50%);
                transform-origin: bottom;
                transition: all 0.1s ease;
                cursor: default;
            }
            #slogan:hover #kor {
                transform: scaleY(0) translateX(-50%);
            }
            #slogan:hover #eng {
                transform: scaleY(1) translateX(-50%);
            }
        </style>
        <script src="/js/main.js"></script>
    </head>
    <body>
        <header>
            <a href="/#" style="text-decoration: none; display: flex; align-items: center"
                ><img src="/images/logo_spirit_mark.png" class="logo" alt="mask" id="logo_mark" />
                <img src="/images/logo_spirit_text.png" class="logo" alt="SPIRIT" id="logo_text"
            /></a>
            <ul>
                <li><a href="/#">Home</a></li>
                <li><a href="/about/#">About us</a></li>
                <li><a href="/awards/#">Awards</a></li>
                <li><a href="/contact/#">Contact</a></li>
            </ul>
        </header>
        <div id="contents">
            <div id="landing_image">
                <img src="/images/logo_spirit_mark.png" alt="MASK" id="landing_mask" />
                <h2 style="color: var(--gray-light); cursor: default">
                    team 25323
                    <span style="color: var(--gray); font-weight: 400">|</span> team 25324
                </h2>
                <img src="/images/logo_spirit_text.png" alt="SPIRIT" id="landing_text" />
                <div id="slogan">
                    <h1 id="kor"><span>혼</span>을 담은 로봇</h1>
                    <h1 id="eng">A robot with a <span>spirit</span></h1>
                </div>
            </div>
        </div>

        <footer>
            <a href="https://www.instagram.com/ftc_s.p.i.r.i.t/" target="_blank">
                <img src="/images/Instagram_Glyph_Gradient.png" alt="instagram" style="height: 30px" />
            </a>
            <a href="https://ftc-events.firstinspires.org/2024/team/25324" target="_blank">
                <img src="/images/FIRST_Vertical_RGB.png" alt="FTC" />
            </a>
            <a href="https://www.youtube.com/@team25324" target="_blank">
                <img src="/images/youtube_social_icon_red.png" alt="youtube" />
            </a>
            <a href="#" onclick="copyEmail()">
                <img src="/images/Email.png" alt="email" style="height: 30px; filter: brightness(0.1)" />
            </a>
            <div class="footerTXTs">
                <div class="flaticon">
                    <a href="https://www.flaticon.com/free-icons/email" title="email icons"
                        >Email icons created by Freepik - Flaticon</a
                    >
                </div>
            </div>
        </footer>
    </body>
</html>
