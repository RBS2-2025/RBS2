<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SPIRIT | About us</title>
        <link rel="stylesheet" href="/css/header.css" />
        <link rel="shortcut icon" href="/images/logo_spirit_mark.png" type="image/x-icon" />
        <style>
            .cards {
                width: calc(100vw - 40px);
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(220px, auto));
                justify-items: center;
            }
            .card {
                position: relative;
                height: 300px;
                width: 200px;
                display: flex;
                flex-direction: column;
                align-items: center;
                background-color: transparent;
                filter: drop-shadow(0px 0px -5px #00000000);
                transition: scale 0.2s ease;
                z-index: 0;
                margin: 5px 10px;
            }
            .card:hover {
                scale: 1.1;
                filter: drop-shadow(0px 0px 5px #00000022);
                z-index: 10;
            }
            body:has(.card:hover) .card:not(:hover) {
                opacity: 0.8;
            }

            .profile {
                margin-top: 20px;
                height: 200px;
                clip-path: circle(70px at center);
                transition: all 0.25s ease-in;
                position: relative;
            }
            .halo {
                width: 140px;
                height: 140px;
                background-color: transparent;
                position: absolute;
                top: 50px;
                border: 4px solid transparent;
                border-radius: 50%;
                transition: all 0.15s ease;
            }
            .card:hover .halo {
                width: 140px;
                height: 140px;
                background-color: transparent;
                position: absolute;
                top: 50px;
                border: 4px solid var(--white);
                border-radius: 50%;
            }
            .name {
                margin-top: 10px;
                color: var(--white);
                font-size: 24px;
                font-weight: 600;
                transition: color 0.2s ease-in;
            }
            .role {
                margin-top: 5px;
                color: var(--gray);
                font-size: 24px;
                font-weight: 400;
                transition: all 0.2s ease;
                transition: color 0.2s ease-in;
            }
        </style>
        <script src="/js/theme.js"></script>
        <script src="/js/about.js"></script>
    </head>
    <body>
        <header>
            <a href="/#" style="text-decoration: none; display: flex; align-items: center"
                ><img src="/images/logo_spirit_mark.png" class="logo" alt="mask" id="logo_mark" />
                <img src="/images/logo_spirit_text.png" class="logo" alt="SPIRIT" id="logo_text"
            /></a>
            <ul>
                <li><a href="/#">Home</a></li>
                <li><a href="/about/#">About us</a></li>
                <li><a href="/awards/#">Awards</a></li>
                <li><a href="/contact/#">Contact</a></li>
            </ul>
        </header>
        <div id="contents">
            <h1 style="transform: translateX(calc(35px - 50vw + 50%))">
                코치 <span style="color: var(--gray)">|</span> 멘토
            </h1>
            <div class="cards" id="seniors"></div>
            <h1 style="transform: translateX(calc(35px - 50vw + 50%))">S.P.R.I.T-25324</h1>
            <div class="cards" id="25324"></div>
            <h1 style="transform: translateX(calc(35px - 50vw + 50%))">S.P.R.I.T-25323</h1>
            <div class="cards" id="25323"></div>
        </div>
        <footer>
            <a href="https://www.instagram.com/ftc_s.p.i.r.i.t/" target="_blank">
                <img src="/images/Instagram_Glyph_Gradient.png" alt="instagram" style="height: 30px" />
            </a>
            <a href="https://ftc-events.firstinspires.org/2024/team/25324" target="_blank">
                <img src="/images/FIRST_Vertical_RGB.png" alt="FTC" />
            </a>
            <a href="https://www.youtube.com/@team25324" target="_blank">
                <img src="/images/youtube_social_icon_red.png" alt="youtube" />
            </a>
            <a onclick="copyEmail()">
                <img src="/images/Email.png" alt="email" style="height: 30px; filter: brightness(0.1)" />
            </a>
            <div class="footerTXTs">
                <div class="flaticon">
                    <a href="https://www.flaticon.com/free-icons/email" title="email icons"
                        >Email icons created by Freepik - Flaticon</a
                    >
                </div>
            </div>
        </footer>
    </body>
</html>
