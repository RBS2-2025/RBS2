<!DOCTYPE html>
<html lang="ko" class="overflow-x-hidden overscroll-none">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPIRIT | Awards</title>
    <link rel="shortcut icon" href="/images/logo_spirit_mark.png" type="image/x-icon" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/main.js"></script>
    <script src="/js/awards.js"></script>

    <style type="text/tailwindcss">
        @layer components {
            /* 동적 콘텐츠 래퍼 */
            .content details {
                @apply flex flex-col items-center mb-5 w-full;
            }

            /* Summary (클릭 가능한 제목 영역) */
            .content summary {
                @apply block w-full max-w-2xl mx-auto cursor-pointer relative list-none outline-none pl-8;
            }
            
            /* 화살표 숨김 */
            .content summary::-webkit-details-marker {
                @apply hidden;
            }

            /* 화살표 */
            .content summary::before {
                content: "";
                @apply absolute border-t-[0.5em] border-t-transparent 
                       border-b-[0.5em] border-b-transparent 
                       border-l-[0.75em] border-l-white
                       transition-transform duration-200 ease-out;

                left: 0.5em;
                top: 0.4em;
            }

            /* 열렸을 때 화살표 회전 */
            .content details[open] summary::before {
                transform: rotate(90deg);
            }

            /* 리스트 스타일 */
            .content ul {
                @apply list-none p-0 m-0 w-full text-center ;
            }
            
            .content li {
                 @apply text-xl my-1 text-gray-300;
            }

            /* 외부 글자 스타일 */
            .content h2 {
                @apply text-xl font-medium;
            }

            /* 내부 글자 스타일 */
            .content h3 {
                @apply font-extralight text-xl text-center my-4 text-white px-4;
                word-break: keep-all;
                overflow-wrap: break-word;
            }

            /* 내부 링크 스타일 */
            .content a {
                @apply block text-center text-xl font-light underline text-blue-300 hover:text-blue-200 mt-2;
            }

            /* 이미지 컨테이너 */
            .images {
                @apply mt-5 flex justify-around w-full flex-wrap gap-4;
            }

            /* 이미지 스타일 */
            .images img {
                @apply h-48 border border-white object-cover;
            }

            /* 햄버거 버튼 */
            .hamburger {
                @apply flex flex-col justify-center items-center w-10 h-10 cursor-pointer relative z-[101];
            }

            .hamburger span {
                @apply block w-6 h-0.5 bg-white transition-all duration-300 ease-in-out;
            }

            .hamburger span:not(:last-child) {
                @apply mb-1;
            }

            /* 햄버거 열렸을 때 */
            .hamburger.active span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }

            .hamburger.active span:nth-child(2) {
                opacity: 0;
            }

            .hamburger.active span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -5px);
            }

            /* 모바일 메뉴 */
            .mobile-menu {
                @apply fixed top-20 right-0 w-64 bg-[#2a2b2e] shadow-lg transform translate-x-full transition-transform duration-300 ease-in-out z-[99];
            }

            .mobile-menu.active {
                @apply translate-x-0;
            }

            .mobile-menu ul {
                @apply flex flex-col p-0 m-0 list-none;
            }

            .mobile-menu li {
                @apply border-b border-gray-700;
            }

            .mobile-menu a {
                @apply block px-6 py-4 text-white hover:bg-[#3a3b3e] transition-colors;
            }
        }
    </style>
</head>
<body class="m-0 flex flex-col items-center min-h-screen bg-[#1f2022] text-white font-sans">

    <header class="w-screen h-20 sticky top-0 left-0 z-[100] flex items-center justify-between bg-[#1f2022] shadow-lg px-4">
        <a href="/#" class="flex items-center no-underline">
            <img src="/images/logo_spirit_mark.png" class="h-16" alt="mask" id="logo_mark" />
            <img src="/images/logo_spirit_text.png" class="h-10 -ml-5" alt="SPIRIT" id="logo_text" />
        </a>
        
        <!-- 데스크톱 메뉴 -->
        <ul class="hidden md:flex flex-row list-none">
            <li class="mx-2.5"><a href="/#" class="text-2xl text-white hover:text-gray-300 transition-colors">Home</a></li>
            <li class="mx-2.5"><a href="/about" class="text-2xl text-white hover:text-gray-300 transition-colors">About us</a></li>
            <li class="mx-2.5"><a href="/awards" class="text-2xl text-white hover:text-gray-300 transition-colors">Awards</a></li>
            <li class="mx-2.5"><a href="/contact" class="text-2xl text-white hover:text-gray-300 transition-colors">Contact</a></li>
        </ul>

        <!-- 햄버거 버튼 (모바일) -->
        <div class="hamburger md:hidden" id="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- 모바일 메뉴 -->
    <nav class="mobile-menu" id="mobileMenu">
        <ul>
            <li><a href="/#" onclick="toggleMenu()">Home</a></li>
            <li><a href="/about.html" onclick="toggleMenu()">About us</a></li>
            <li><a href="/awards.html" onclick="toggleMenu()">Awards</a></li>
            <li><a href="/contact.html" onclick="toggleMenu()">Contact</a></li>
        </ul>
    </nav>

    <!-- 본문 -->

    <div id="contents" class="w-full max-w-3xl flex flex-col flex-1 py-10 min-h-[500px]">
        </div>

    <footer class="h-16 w-screen flex items-center justify-center bg-[#1f2022] relative z-10 mt-auto">
        <div class="flex">
            <a href="https://www.instagram.com/ftc_s.p.i.r.i.t/" target="_blank" 
               class="bg-white rounded-md mx-2.5 h-10 w-10 flex items-center justify-center transition-transform duration-100 ease-linear hover:scale-110">
                <img src="/images/Instagram_Glyph_Gradient.png" alt="instagram" class="h-5" />
            </a>
            <a href="https://ftc-events.firstinspires.org/2024/team/25324" target="_blank"
               class="bg-white rounded-md mx-2.5 h-10 w-10 flex items-center justify-center transition-transform duration-100 ease-linear hover:scale-110">
                <img src="/images/FIRST_Vertical_RGB.png" alt="FTC" class="h-5 object-contain" />
            </a>
            <a href="https://www.youtube.com/@team25324" target="_blank"
               class="bg-white rounded-md mx-2.5 h-10 w-10 flex items-center justify-center transition-transform duration-100 ease-linear hover:scale-110">
                <img src="/images/youtube_social_icon_red.png" alt="youtube" class="h-5 object-contain" />
            </a>
            <a onclick="copyEmail()" class="bg-white rounded-md mx-2.5 h-10 w-10 flex items-center justify-center transition-transform duration-100 ease-linear hover:scale-110 cursor-pointer">
                <img src="/images/Email.png" alt="email" class="h-5 brightness-0" />
            </a>
        </div>

        <div id="Alert" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/60">
            <div class="w-80 max-w-[90%] rounded-xl bg-[#2a2b2e] p-6 text-center text-white shadow-lg">
                <p id="AlertMessage" class="text-base leading-6"></p>
                <button id="AlertClose" class="mt-4 inline-flex items-center justify-center rounded-md bg-white/10 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-white/20">확인</button>
            </div>
        </div>

        <div id="ImageModal" class="fixed inset-0 z-[200] hidden items-center justify-center bg-black/80 cursor-pointer" onclick="closeImageModal()">
            <div class="relative max-w-[70vw] max-h-[70vh] p-4">
                <img id="ModalImage" src="" class="max-w-full max-h-[70vh] object-contain" />
            </div>
        </div>
    </footer>

</body>
</html>
